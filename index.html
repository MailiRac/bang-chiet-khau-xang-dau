<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Giá & Chiết Khấu Xăng Dầu</title>
  
  <!-- Office.js library from Microsoft -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Header Card -->
    <header class="header-card">
      <div class="header-title-group">
        <h1>
          <span>⛽</span> BẢNG GIÁ & CHIẾT KHẤU
        </h1>
        <p>Hệ thống theo dõi chiết khấu thương nhân phân phối và đầu mối</p>
      </div>
      <div class="header-meta">
        <div class="meta-item">
          <span class="label">Ngày áp dụng</span>
          <span class="value" id="date-display">--/--/----</span>
        </div>
        <div class="meta-item">
          <span class="label">Giờ hiệu lực</span>
          <span class="value" id="time-display">--:--</span>
        </div>
      </div>
    </header>

    <!-- Controls Bar -->
    <div class="controls-card">
      <!-- Search Input -->
      <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Tìm theo tên ĐM/TNPP, kho, khu vực...">
      </div>

      <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
        <!-- Region Filter Pills -->
        <div class="filter-pills" id="region-filters">
          <!-- Generated by JS -->
        </div>

        <!-- Sync Button -->
        <button id="btn-sync" class="btn-refresh" title="Làm mới từ Sheet Excel">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          Làm mới
        </button>
      </div>
    </div>

    <!-- Data Table Card -->
    <div class="table-card">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th class="center" style="width: 90px;">Ngày</th>
              <th style="width: 220px;">ĐM / TNPP</th>
              <th class="center" style="width: 70px;">E5</th>
              <th class="center" style="width: 70px;">E10</th>
              <th class="center" style="width: 80px;">DO 0.05</th>
              <th class="center" style="width: 80px;">DO 0.001</th>
              <th class="center" style="width: 60px;">Giờ</th>
              <th class="center" style="width: 100px;">Khu Vực</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>

      <!-- Table Footer -->
      <div class="table-footer">
        <span>Dữ liệu được cập nhật bởi DuyenNVH</span>
      </div>
    </div>
  </div>

  <!-- Fallback data if opened outside Excel -->
  <script src="data.js"></script>
  <!-- Main Application Logic -->
  <script src="app.js"></script>
</body>
</html>
